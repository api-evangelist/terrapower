aid: terrapower
name: TerraPower
description: >-
  TerraPower is a Bellevue, Washington-based advanced nuclear innovation
  company founded in 2006 with Bill Gates as founder and chair. Its flagship
  product is the Natrium reactor, a 345 MWe sodium-cooled fast reactor
  co-developed with GE Vernova Hitachi Nuclear Energy and paired with an
  integrated molten salt energy storage system that can boost output to
  500 MWe for up to five-plus hours to follow renewable grid load.
  TerraPower broke ground in 2024 on the first commercial Natrium demonstration
  plant in Kemmerer, Wyoming under the U.S. Department of Energy's Advanced
  Reactor Demonstration Program (ARDP), a 50/50 cost-share with up to
  $2 billion in federal funding. The company's second business line,
  TerraPower Isotopes (TPI), produces research-grade actinium-225 — an
  alpha-emitting radionuclide used in targeted alpha therapy for cancer —
  from DOE thorium-229 stockpiles in partnership with Isotek, with a lab in
  Everett WA and a cGMP manufacturing facility under construction in
  Philadelphia's Bellwether District. TerraPower has no commercial developer
  API, SDK, or public partner integration platform; its revenue model is
  reactor sales, plant operation, and isotope supply contracts with
  pharmaceutical partners including Aktis Oncology, Advanced Accelerator
  Applications, Cardinal Health, and Point Biopharma. The company does
  maintain a meaningful open-source nuclear engineering footprint on GitHub
  — most notably ARMI (Advanced Reactor Modeling Interface), an Apache 2.0
  Python framework for nuclear reactor design and analysis automation used
  internally to design Natrium and made available to the wider reactor
  engineering community.
